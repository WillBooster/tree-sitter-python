[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "Python grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "python"]
license = "MIT"
name = "willbooster-tree-sitter-python"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-python"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*.scm", "src/*", "tree-sitter.json", "/LICENSE"]

[lib]
name = "tree_sitter_python"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "14.0.0" }
